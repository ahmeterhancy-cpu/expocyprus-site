# ═══════════════════════════════════════════════════════════════
# cPanel Git Version Control — Otomatik Deployment
# https://docs.cpanel.net/cpanel/files/git-version-control/
# ═══════════════════════════════════════════════════════════════
# GERÇEK KURULUM (single-dir):
#   Repository Path = /home/<kullanıcı>/public_html
# Yani depo klasörünün KENDİSİ hem uygulama hem web root. Root .htaccess
# kaynak dosyaları gizleyip istekleri public/ altına yönlendiriyor.
# Bu yüzden "public/ dosyalarını web root'a kopyalama" adımı GEREKMEZ —
# git pull zaten dosyaları yerinde günceller.
#
# DİKKAT — burada çalışma ağacını (working tree) kirleten komut OLMAMALI:
#   • cPanel, depoda commit'lenmemiş değişiklik varsa "Deploy HEAD Commit"
#     butonunu pasif yapar.
#   • Eski sürüm `cp -R public/. $HOME/public_html/` yapıyordu; depo zaten
#     public_html olduğu için bu, public/ içeriğini depo köküne kopyalayıp
#     takipsiz dosya yığını üretiyor ve butonu kalıcı olarak kilitliyordu.
#   • Eski sürüm ayrıca depo içinde `composer install --no-dev` çalıştırıyordu;
#     vendor/ bu depoda takipli olduğu için o da ağacı kirletiyordu.
#     vendor/ commit'li, composer'a gerek yok.
#
# Görevler deponun kendi dizininde çalışır — bu yüzden yollar GÖRELİ,
# böylece kurulum yolu değişse de bozulmaz.
# ═══════════════════════════════════════════════════════════════

---
deployment:
  tasks:
    # Yazılabilir dizinler (git boş klasör tutmaz, her deploy'da garantiye alalım)
    - /bin/mkdir -p storage/sessions storage/cache storage/logs
    - /bin/chmod -R 775 storage
    - /bin/mkdir -p public/uploads
    - /bin/chmod -R 775 public/uploads

    # .env yoksa example'dan oluştur (yalnızca ilk deploy)
    - test -f .env || /bin/cp .env.example .env

    # Deploy kaydı (storage/logs .gitignore'da — ağacı kirletmez)
    - /bin/echo "Deployment $(date) — completed" >> storage/logs/deploy.log
