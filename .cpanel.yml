# ═══════════════════════════════════════════════════════════════
# cPanel Git Version Control — Otomatik Deployment
# https://docs.cpanel.net/cpanel/files/git-version-control/
# ═══════════════════════════════════════════════════════════════
# Repository Path = /home/<kullanici>/expocyprus.com
# Yani depo klasörünün KENDİSİ uygulama klasörü. Deploy adımlarının tek
# işi, public/ içeriğini web root'a (public_html) taşımak ve yazılabilir
# dizinleri hazırlamak.
#
# DİKKAT — burada çalışma ağacını (working tree) DEĞİŞTİREN komut olmamalı.
# cPanel, deponun commit'lenmemiş değişikliği varsa "Deploy HEAD Commit"
# butonunu pasif yapar. Eski sürümde adımlar depo klasörünü kendi üstüne
# kopyalıyor ve depo içinde "composer install --no-dev" çalıştırıyordu;
# vendor/ bu depoda takipli olduğu için her deploy ağacı kirletiyor ve
# buton bir daha aktif olmuyordu. vendor/ zaten commit'li, composer'a
# gerek yok.
# ═══════════════════════════════════════════════════════════════

---
deployment:
  tasks:
    # $HOME kullanıyoruz — $USER cPanel deploy ortamında her zaman dolu olmayabilir.
    - export DEPLOY_PATH=$HOME/expocyprus.com
    - export PUBLIC_PATH=$HOME/public_html

    # 1. public/ içeriğini web root'a kopyala (merge — mevcut uploads silinmez)
    - /bin/cp -R $DEPLOY_PATH/public/. $PUBLIC_PATH/

    # 2. Yazılabilir dizinler
    - /bin/mkdir -p $DEPLOY_PATH/storage/sessions $DEPLOY_PATH/storage/cache $DEPLOY_PATH/storage/logs
    - /bin/chmod -R 775 $DEPLOY_PATH/storage
    - /bin/mkdir -p $PUBLIC_PATH/uploads
    - /bin/chmod -R 775 $PUBLIC_PATH/uploads

    # 3. .env yoksa example'dan oluştur (yalnızca ilk deploy)
    - test -f $DEPLOY_PATH/.env || /bin/cp $DEPLOY_PATH/.env.example $DEPLOY_PATH/.env

    # 4. Deploy kaydı (storage/logs .gitignore'da — ağacı kirletmez)
    - echo "Deployment $(date) — completed" >> $DEPLOY_PATH/storage/logs/deploy.log
